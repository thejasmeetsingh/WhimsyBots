name: Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install system dependencies (WeasyPrint / cairo / pango)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libpq-dev \
            libcairo2 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info \
            fonts-dejavu \
            fonts-liberation

      - name: Install Python dependencies
        working-directory: src
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: src
        env:
          DJANGO_SETTINGS_MODULE: whimsybots.settings.test
          SECRET_KEY: ci-secret-key
        run: pytest -v --maxfail=1 --tb=short

      - name: Install ruff
        run: pip install ruff

      - name: Lint (non-blocking)
        # Reports docstring + style violations but does not fail the build
        # on the first rollout — gives the codebase time to converge on the
        # style documented in docs/DOCSTRING_STYLE.md.
        run: ruff check src/ || true
